<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Workflow 5 Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: infinite-canvas artboard. Frames on a dot grid, joined by flow arrows; pan, zoom, click to enlarge. */
:root{
  --canvas:#e9ebf0; --dot:#c9cdd8; --frame:#ffffff; --fg:#151a24; --muted:#5d6577; --line:#d6dae3;
  --accent:#4f6ef7; --accent-soft:#e4e9fe; --arrow:#4f6ef7; --branch:#8a93a6; --note:#fff6d6; --note-fg:#5b4a10;
  --sans:"Inter",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#14171e;--dot:#2a2f3b;--frame:#1d212b;--fg:#e7e9ef;--muted:#9aa2b3;--line:#323847;--accent:#8ea2ff;--accent-soft:#252d48;--arrow:#8ea2ff;--branch:#6c7489;--note:#3a3216;--note-fg:#f1e3a8;color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#14171e;--dot:#2a2f3b;--frame:#1d212b;--fg:#e7e9ef;--muted:#9aa2b3;--line:#323847;--accent:#8ea2ff;--accent-soft:#252d48;--arrow:#8ea2ff;--branch:#6c7489;--note:#3a3216;--note-fg:#f1e3a8;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--canvas);color:var(--fg);font-family:var(--sans);overflow:hidden}
#vp{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px}
#vp.drag{cursor:grabbing}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--arrow);stroke-width:2.5}
.wire.alt{stroke:var(--branch);stroke-dasharray:7 6}
.frame{position:absolute;display:flex;flex-direction:column;gap:8px}
.frame .lbl{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.frame .lbl b{color:var(--fg);font-family:var(--sans);font-size:15px;font-weight:600}
.frame button{all:unset;cursor:zoom-in;display:block;border-radius:6px;overflow:hidden;background:var(--frame);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 22px rgba(20,26,40,.12);outline:1px solid var(--line)}
.frame button:focus-visible{outline:3px solid var(--accent)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.lane{position:absolute;font-weight:700;font-size:30px;letter-spacing:-.01em;white-space:nowrap}
.lane small{display:block;font-weight:400;font-size:16px;color:var(--muted);letter-spacing:0;margin-top:4px}
.chip{position:absolute;transform:translate(-50%,-50%);background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;
  padding:5px 12px;border-radius:999px;white-space:nowrap;border:1px solid var(--accent)}
.note{position:absolute;background:var(--note);color:var(--note-fg);padding:16px 18px;border-radius:6px;font-size:15px;line-height:1.5;
  box-shadow:0 4px 14px rgba(0,0,0,.1)}
.note b{display:block;margin-bottom:4px}
.hud{position:fixed;z-index:5;display:flex;gap:6px;align-items:center;background:var(--frame);border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.hud button{all:unset;cursor:pointer;min-width:32px;height:32px;display:grid;place-items:center;border-radius:6px;font-size:15px;font-weight:600;color:var(--fg);padding:0 6px}
.hud button:hover{background:var(--accent-soft)}
.hud button:focus-visible{outline:2px solid var(--accent)}
.hud span{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.title{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));
  background:var(--frame);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.12);max-width:calc(100% - 32px)}
.title h1{font-size:15px;margin:0;font-weight:600}
.title p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(8,10,16,.88);display:grid;grid-template-rows:auto 1fr;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb header{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:12px}
.lb header b{font-size:15px}
.lb header span{color:#b9c0cf;font-size:13px;margin-left:8px}
.lb header .nav{display:flex;gap:6px}
.lb header button{all:unset;cursor:pointer;color:#fff;border:1px solid #4a5163;border-radius:6px;padding:6px 12px;font-size:13px}
.lb header button:focus-visible{outline:2px solid #8ea2ff}
.lb .imgwrap{min-height:0;display:grid;place-items:center}
.lb img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style>

<div id="vp"><div id="board"><svg class="wires" id="wires"></svg></div></div>
<div class="title"><h1>AI workflow 5 · Create a document from CAD</h1><p>Drag or scroll to pan · pinch, ⌘/Ctrl + scroll, or +/− to zoom · click a screen to enlarge</p></div>
<div class="hud" role="toolbar" aria-label="Zoom">
  <button type="button" id="zout" aria-label="Zoom out">−</button><span id="zlvl">100%</span>
  <button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zfit">Fit</button>
</div>
<div class="lb" id="lb" hidden>
  <header><div><b id="lbt"></b><span id="lbs"></span></div>
    <div class="nav"><button type="button" id="lbp">← Prev</button><button type="button" id="lbn">Next →</button><button type="button" id="lbx">Close</button></div></header>
  <div class="imgwrap"><img id="lbi" alt=""></div>
</div>

<script>
const FW = 480, FH = 300, CW = 640, RH = 420, OX = 80, OY = 260;
const pos = (c, r) => ({ x: OX + c * CW, y: OY + r * RH });

// id, image, title, caption, col, row
const F = [
  ['start', 'q-start', 'Start', 'Prototype entry', 0, 2],
  ['home', 'q-home', 'Home', 'from q20 → New document', 1, 2],
  ['s1', 'q-step1', 'Create · step 1', 'Upload or link CAD', 2, 2],
  ['s1c', 'q-step1-cad', 'Step 1 · CAD attached', 'Next or Enter', 3, 2],
  ['s2', 'q-step2', 'Create · step 2', 'Choose how to make it · Done disabled', 4, 2],

  ['bl1', 'blank-picked', 'Blank document', 'Selected', 5, 0],
  ['bl2', 'blank-uploading', 'Creating document', 'Upload animation', 6, 0],
  ['bl3', 'blank-parsed', 'CAD parsed', 'Document ready', 7, 0],
  ['bl4', 'blank-doc', 'Document', 'Document setup in outline', 8, 0],
  ['bl5', 'blank-setup', 'Document setup', 'Reopens the choices', 9, 0],

  ['im1', 'import-picked', 'Import · elements', 'Nothing selected', 5, 1],
  ['im2', 'import-some', 'Import · some', 'Select all shows a dash', 6, 1],
  ['im3', 'import-all', 'Import · all', 'Select all checked', 7, 1],
  ['im4', 'import-uploading', 'Creating document', 'Upload animation', 8, 1],
  ['im5', 'import-doc', 'Document', 'After parse', 9, 1],

  ['au1', 'auto-picked', 'Auto Assembly', 'Selected', 5, 2],
  ['au2', 'auto-uploading', 'Creating document', 'CAD is being read', 6, 2],
  ['au3', 'auto-parsed', 'Assembly plan', 'Pops up after the CAD is parsed', 7, 2],
  ['au4', 'auto-doc', 'Document', 'Create operations and document', 8, 2],

  ['pl1', 'parts-picked', 'Parts list', 'Selected', 5, 3],
  ['pl2', 'parts-uploading', 'Creating document', 'Upload animation', 6, 3],
  ['pl3', 'parts-doc', 'Document', 'After parse', 7, 3],

  ['wi1', 'wi-picked', 'Work instruction', 'Selected', 5, 4],
  ['wi2', 'wi-uploading', 'Creating document', 'Upload animation', 6, 4],
  ['wi3', 'wi-doc', 'Document', 'After parse', 7, 4],

  ['os1', 'os-workspace', 'Onshape / SolidWorks', 'Plugin panel', 1, 6],
  ['os2', 'os-uploaded', 'CAD uploaded', 'New document', 2, 6],
  ['os3', 'os-panel', 'Choose how to make it', 'Same five tiles in the panel', 3, 6],
  ['os4', 'os-picked', 'Work instruction', 'Selected · Done', 4, 6],
  ['os5', 'os-uploading', 'Quarter20 · creating', 'Upload animation', 5, 6],
  ['os6', 'os-parsed', 'Quarter20 · ready', 'After parse', 6, 6],
];
const E = [
  ['start','home'],['home','s1'],['s1','s1c'],['s1c','s2'],
  ['s2','bl1'],['s2','im1'],['s2','au1'],['s2','pl1'],['s2','wi1'],
  ['bl1','bl2'],['bl2','bl3'],['bl3','bl4'],['bl4','bl5'],
  ['im1','im2'],['im2','im3'],['im3','im4'],['im4','im5'],
  ['au1','au2'],['au2','au3'],['au3','au4'],
  ['pl1','pl2'],['pl2','pl3'],
  ['wi1','wi2'],['wi2','wi3'],
  ['start','os1','alt'],['os1','os2'],['os2','os3'],['os3','os4'],['os4','os5'],['os5','os6'],
];
const CHIPS = [['bl1','Blank document'],['im1','Import'],['au1','Auto Assembly'],['pl1','Parts list'],['wi1','Work instruction']];

const board = document.getElementById('board');
const byId = {};
F.forEach(([id, img, t, cap, c, r], i) => {
  const p = pos(c, r); byId[id] = { ...p, i };
  const el = document.createElement('div');
  el.className = 'frame'; el.style.left = p.x + 'px'; el.style.top = (p.y - 30) + 'px'; el.style.width = FW + 'px';
  el.innerHTML = `<div class="lbl"><b>${t}</b>${cap}</div><button type="button" style="width:${FW}px;height:${FH}px" aria-label="Enlarge ${t}"><img src="img/${img}.jpg" alt="${t}: ${cap}" loading="lazy" draggable="false"></button>`;
  el.querySelector('button').addEventListener('click', (e) => { if (moved) { e.preventDefault(); return; } openLb(i); });
  board.appendChild(el);
});

function addEl(cls, x, y, html, w) {
  const el = document.createElement('div'); el.className = cls; el.style.left = x + 'px'; el.style.top = y + 'px';
  if (w) el.style.width = w + 'px'; el.innerHTML = html; board.appendChild(el); return el;
}
addEl('lane', OX, OY + 2 * RH - 170, 'Start in Quarter20<small>Upload the CAD, then choose how the document is made, all in one modal</small>');
addEl('lane', OX + 5 * CW, OY - 200 - 0 * RH - 0, 'Five ways to make the document<small>Each branch picks up after Done on step 2</small>');
addEl('lane', OX + CW, OY + 6 * RH - 120, 'Start in Onshape / SolidWorks<small>Same choices, shown in the plugin panel</small>');
addEl('note', OX + 9 * CW, OY + 2 * RH + 20,
  '<b>Auto Assembly waits for the CAD</b>The plan can only be built once the assembly is known, so it opens after parsing finishes (about 3 minutes in the prototype). X skips it.', 420);
addEl('note', OX + 8 * CW, OY + 3 * RH + 40,
  '<b>Prototype note</b>Every branch currently opens the same sample work instruction. Blank, Parts list and Work instruction do not yet produce different documents.', 420);

const W = OX + 10 * CW + 80, H = OY + 7 * RH;
board.style.width = W + 'px'; board.style.height = H + 'px';
const svg = document.getElementById('wires');
svg.setAttribute('width', W); svg.setAttribute('height', H);
svg.innerHTML = `<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--arrow)"/></marker>
  <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--branch)"/></marker></defs>`;
E.forEach(([a, b, kind]) => {
  const A = byId[a], B = byId[b];
  let d;
  if (kind === 'alt') {
    const x1 = A.x + FW / 2, y1 = A.y + FH + 8, x2 = B.x - 14, y2 = B.y + FH / 2;
    d = `M${x1} ${y1} V${y2 - 24} Q${x1} ${y2} ${x1 + 24} ${y2} H${x2}`;
  } else {
    const x1 = A.x + FW + 8, y1 = A.y + FH / 2, x2 = B.x - 14, y2 = B.y + FH / 2;
    if (Math.abs(y1 - y2) < 1) d = `M${x1} ${y1} H${x2}`;
    else { const mx = (x1 + x2) / 2; d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; }
  }
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d); path.setAttribute('class', 'wire' + (kind === 'alt' ? ' alt' : ''));
  path.setAttribute('marker-end', kind === 'alt' ? 'url(#ah2)' : 'url(#ah)');
  svg.appendChild(path);
});
const os = byId.os1; addEl('chip', OX + FW / 2, os.y - 70, 'from onshape/SW');

// pan & zoom
const vp = document.getElementById('vp'); const zl = document.getElementById('zlvl');
let s = 1, tx = 0, ty = 0, moved = false;
const apply = () => { board.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; zl.textContent = Math.round(s * 100) + '%'; };
const zoomAt = (ns, cx, cy) => { ns = Math.min(2.5, Math.max(0.08, ns)); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); };
const fit = () => { const r = vp.getBoundingClientRect(); s = Math.min((r.width - 32) / W, (r.height - 100) / H); tx = (r.width - W * s) / 2; ty = 80 + (r.height - 100 - H * s) / 2; apply(); };
vp.addEventListener('wheel', (e) => { e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(s * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, { passive: false });
const pts = new Map(); let last = null, pinch = null;
vp.addEventListener('pointerdown', (e) => { pts.set(e.pointerId, e); moved = false; last = { x: e.clientX, y: e.clientY };
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), s }; }
  vp.classList.add('drag'); });
window.addEventListener('pointermove', (e) => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
  if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    zoomAt(pinch.s * d / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); moved = true; return; }
  const dx = e.clientX - last.x, dy = e.clientY - last.y; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  tx += dx; ty += dy; last = { x: e.clientX, y: e.clientY }; apply(); });
const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) vp.classList.remove('drag');
  if (pts.size === 1) { const p = [...pts.values()][0]; last = { x: p.clientX, y: p.clientY }; } };
window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
const center = () => { const r = vp.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById('zin').onclick = () => zoomAt(s * 1.25, ...center());
document.getElementById('zout').onclick = () => zoomAt(s / 1.25, ...center());
document.getElementById('zfit').onclick = fit;
window.addEventListener('resize', fit);
fit();

// lightbox
const lb = document.getElementById('lb'), lbi = document.getElementById('lbi');
let cur = 0;
function openLb(i) { cur = (i + F.length) % F.length; const f = F[cur]; lbi.src = `img/${f[1]}.jpg`; lbi.alt = f[2];
  document.getElementById('lbt').textContent = f[2]; document.getElementById('lbs').textContent = f[3]; lb.hidden = false; }
document.getElementById('lbx').onclick = () => { lb.hidden = true; };
document.getElementById('lbp').onclick = () => openLb(cur - 1);
document.getElementById('lbn').onclick = () => openLb(cur + 1);
lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('imgwrap')) lb.hidden = true; });
document.addEventListener('keydown', (e) => { if (lb.hidden) return;
  if (e.key === 'Escape') lb.hidden = true; if (e.key === 'ArrowRight') openLb(cur + 1); if (e.key === 'ArrowLeft') openLb(cur - 1); });
</script>

</html>
